<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI-catwalken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: fullbleed 3D stage, program card bottom-left, run-of-show timeline along the bottom edge. Single "night show" look. */
  :root {
    --night: #1a1030;      /* stage darkness */
    --ink: #fff6fb;        /* text on dark */
    --muted: #c9b8e0;      /* secondary text */
    --pink: #ff7eb6;       /* runway neon */
    --cyan: #7ef0ff;       /* runway neon 2 */
    --card: rgba(34, 20, 60, 0.78);
    --line: rgba(255, 255, 255, 0.14);
    --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); gap: 12px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.4vw, 46px); line-height: 0.95; margin: 0;
    letter-spacing: 0.01em; color: var(--ink); text-shadow: 0 3px 0 #7a2d6b, 0 0 24px rgba(255, 126, 182, 0.55); }
  .brand p { margin: 6px 0 0; font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
  .controls button { font: 800 13px/1 var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 13px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: transform 0.12s, background 0.2s; }
  .controls button:hover { background: rgba(255, 126, 182, 0.28); }
  .controls button:active { transform: scale(0.94); }
  .controls button:focus-visible, .timeline button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { background: var(--pink); color: #2a0f2a; border-color: transparent; }

  .bottom { display: flex; flex-direction: column; gap: 10px; }
  .card { pointer-events: auto; max-width: 440px; background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 14px 18px 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35); }
  .card.pop { animation: pop 0.5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: translateY(16px) scale(0.96); opacity: 0.2; } to { transform: none; opacity: 1; } }
  .eyebrow { display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px currentColor; }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 38px); line-height: 1; margin: 6px 0 4px; text-wrap: balance; }
  .meta { font-size: 13px; font-weight: 700; color: var(--cyan); }
  .joke { margin: 8px 0 0; font-size: 15px; line-height: 1.45; font-weight: 600; max-width: 60ch; }

  .years span { position: absolute; top: 0; white-space: nowrap; }
  .timeline { pointer-events: auto; display: flex; gap: 3px; align-items: flex-end; }
  .timeline button { flex: 1 1 0; min-width: 0; height: 10px; padding: 0; border: 0; border-radius: 4px; cursor: pointer; opacity: 0.45;
    transition: height 0.2s, opacity 0.2s; }
  .timeline button.done { opacity: 0.8; }
  .timeline button.now { height: 22px; opacity: 1; box-shadow: 0 0 12px currentColor; }
  .years { position: relative; height: 14px; margin-top: 4px; font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; }

  @media (max-width: 560px) {
    .card { max-width: none; padding: 12px 14px 14px; }
    .joke { font-size: 14px; }
    .controls button { padding: 8px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="stage" aria-label="3D-catwalk där AI-modeller går en i taget"></canvas>
<div class="hud">
  <div class="top">
    <div class="brand">
      <h1>AI-catwalken</h1>
      <p>Kollektion 2024–2026 · <span id="count">0</span> modeller</p>
    </div>
    <div class="controls">
      <button id="prev" type="button">Förra</button>
      <button id="play" type="button" aria-pressed="false">Paus</button>
      <button id="next" type="button">Nästa</button>
      <button id="tempo" type="button">Tempo 1×</button>
      <button id="sound" type="button" aria-pressed="false">Musik på</button>
    </div>
  </div>
  <div class="bottom">
    <div class="card" id="card" aria-live="polite">

      <h2 id="name">…</h2>
      <div class="meta" id="meta"></div>
      <p class="joke" id="joke"></p>
    </div>
    <div>
      <div class="timeline" id="timeline" role="group" aria-label="Hoppa till modell"></div>
      <div class="years" id="years"></div>
    </div>
  </div>
</div>

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

scene.fog = new THREE.Fog(0x1a1030, 22, 48);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

const hemi = new THREE.HemisphereLight(0xffe3f4, 0x3a2a6a, 0.6);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff1e6, 1.05);
key.position.set(6, 14, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10; key.shadow.camera.right = 10;
key.shadow.camera.top = 16; key.shadow.camera.bottom = -16;
key.shadow.camera.near = 1; key.shadow.camera.far = 40;
key.shadow.radius = 6;
key.shadow.bias = -0.0005;
scene.add(key);

const soft = (color, o = {}) => new THREE.MeshPhysicalMaterial(Object.assign({ color, roughness: 0.42, metalness: 0, clearcoat: 0.55, clearcoatRoughness: 0.35 }, o));
const flat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.7 }, o));

function shadowy(obj) { obj.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return obj; }

// ---------------------------------------------------------------- stage build
const RUN_START = -15, RUN_END = 5.2;
let wallTex, drawWall;
(function buildStage() {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), flat(0x2a1b4a, { roughness: 0.9 }));

  const run = new THREE.Mesh(new THREE.BoxGeometry(4, 0.5, runLen), soft(0xf7cfe3, { roughness: 0.25, clearcoat: 1 }));

  // neon edges

  for (const s of [-1, 1]) {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, runLen), neon(s < 0 ? 0xff7eb6 : 0x7ef0ff));
    strip.position.set(2.02 * s, 0.46, run.position.z); scene.add(strip);
  }
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.02, 0.045, 8, 64, Math.PI), neon(0xffd36e));
  ring.rotation.x = Math.PI / 2; ring.rotation.z = Math.PI; ring.position.set(0, 0.46, RUN_END + 1); scene.add(ring);
  // runway light dots

// ---------------------------------------------------------------- helpers
function makeCanvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h, c);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
  t.userData.canvas = c; t.userData.ctx = ctx;
  return t;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const hex = (c) => '#' + c.toString(16).padStart(6, '0');
function shade(c, f) { const col = new THREE.Color(c); const hsl = {}; col.getHSL(hsl); col.setHSL(hsl.h, hsl.s, Math.min(1, Math.max(0, hsl.l + f))); return col.getHex(); }

function drawLabel(tex, text, bg, fg) {
  const { canvas: c, ctx } = tex.userData;
  ctx.clearRect(0, 0, c.width, c.height);
  ctx.fillStyle = bg; roundRect(ctx, 6, 6, c.width - 12, c.height - 12, 40); ctx.fill();
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let size = 84; ctx.font = `400 ${size}px "Bagel Fat One", "Arial Rounded MT Bold", sans-serif`;
  while (ctx.measureText(text).width > c.width - 40 && size > 30) { size -= 4; ctx.font = `400 ${size}px "Bagel Fat One", "Arial Rounded MT Bold", sans-serif`; }
  ctx.fillText(text, c.width / 2, c.height / 2 + 4);
  tex.needsUpdate = true;
}

function makeBubble(text, opts = {}) {
  const c = document.createElement('canvas'); const ctx = c.getContext('2d');
  const font = `800 44px Nunito, "Segoe UI", sans-serif`;
  ctx.font = font; const tw = Math.ceil(ctx.measureText(text).width);
  c.width = tw + 70; c.height = 120;
  ctx.font = font;
  ctx.fillStyle = opts.bg || '#ffffff';
  roundRect(ctx, 4, 4, c.width - 8, 86, 40); ctx.fill();
  ctx.beginPath(); ctx.moveTo(c.width / 2 - 16, 88); ctx.lineTo(c.width / 2, 116); ctx.lineTo(c.width / 2 + 16, 88); ctx.fill();
  ctx.fillStyle = opts.fg || '#2a1640'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, 48);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.renderOrder = 10;
  const k = 0.0085; sp.userData.base = new THREE.Vector2(c.width * k, c.height * k);
  sp.scale.set(0.01, 0.01, 1);
  return sp;
}

}

{

let confNext = 0;
function burstConfetti(center, n = 260) {
  for (let k = 0; k < n; k++) {
    const d = confData[confNext]; confNext = (confNext + 1) % CONF;
    d.alive = true;
    d.p.set(center.x + (Math.random() - 0.5) * 2, center.y + 6 + Math.random() * 3, center.z + (Math.random() - 0.5) * 4);
    d.v.set((Math.random() - 0.5) * 3, -1 - Math.random() * 1.5, (Math.random() - 0.5) * 3);

const dummy = new THREE.Object3D();
function updateConfetti(dt) {
  for (let i = 0; i < CONF; i++) {
    const d = confData[i];
    if (d.alive) {
      d.v.y = Math.max(d.v.y - dt * 1.2, -2.2);
      d.p.addScaledVector(d.v, dt);
      d.p.x += Math.sin(d.p.y * 3 + i) * dt * 0.6;
      d.r.x += d.w.x * dt; d.r.y += d.w.y * dt; d.r.z += d.w.z * dt;
      if (d.p.y < 0.52) { d.p.y = 0.52; d.v.set(0, 0, 0); d.w.set(0, 0, 0); d.r.x = -Math.PI / 2; }
    }
    dummy.position.copy(d.p); dummy.rotation.copy(d.r); dummy.updateMatrix();
    confetti.setMatrixAt(i, dummy.matrix);
  }
  confetti.instanceMatrix.needsUpdate = true;
}

function updateBits(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i]; b.life -= dt; b.update(b, dt);
    if (b.life <= 0) { scene.remove(b.obj); if (b.obj.material && b.obj.material !== puffMat && b.obj.material !== M.gold) { b.obj.material.map?.dispose(); b.obj.material.dispose(); } bits.splice(i, 1); }

function floatText(text, pos, opts) {

  spawnBit(sp, 2.6, (b, dt) => { const k = 1 - b.life / b.max; const s = Math.min(1, k * 6); sp.scale.set(sp.userData.base.x * s * 1.4, sp.userData.base.y * s * 1.4, 1); sp.position.y += dt * 0.7; sp.material.opacity = k > 0.8 ? (1 - k) * 5 : 1; });

// ---------------------------------------------------------------- walkers
const IN_X = -0.35, OUT_X = 1.2;
let walkers = [];

class Walker {
  constructor(spec, index) {
    this.spec = spec; this.index = index;
    this.g = new Set(spec.gag);
    const col = ORG[spec.o].c;
    this.scale = this.g.has('big') ? 1.75 : this.g.has('tiny') ? 0.6 : 1;
    this.speed = 3.0 * (this.g.has('fast') ? 2.6 : 1) * (this.g.has('slow') ? 0.5 : 1) * (this.g.has('big') ? 0.8 : 1) * (this.g.has('tiny') ? 1.15 : 1);
    this.bean = buildBean(col, spec.l, spec.acc);
    this.bean.rig.scale.setScalar(this.scale);
    scene.add(this.bean.root);
    this.x = IN_X; this.z = RUN_START - 1.2; this.y = 0.5;
    this.heading = 0; this.targetHeading = this.g.has('moonwalk') ? Math.PI : 0;
    this.state = 'in'; this.t = 0; this.phase = 0; this.thought = false;
    this.bubble = null; this.bubbleI = 0; this.bubbleT = 1.2;
    this.followers = [];
    if (this.g.has('herd')) {
      (spec.herd || []).forEach((lbl, i) => {
        const f = buildBean(shade(col, (i - 1) * 0.08), lbl, spec.acc.slice(0, 1));
        const s = spec.o === 'Alibaba' ? [0.55, 0.85, 1.25][i] || 1 : 0.95;
        f.rig.scale.setScalar(s); scene.add(f.root);
        this.followers.push({ bean: f, dx: (i % 2 ? 1 : -1) * (0.9 + i * 0.15), dz: -1.5 - i * 1.3, ph: i * 1.3, s });
      });
    }
    if (this.g.has('ribbon')) {
      const tex = makeCanvasTexture(512, 64, (ctx, w, h) => {
        ctx.fillStyle = '#e9f1ff'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#3c6fd8'; ctx.font = '800 34px Nunito, sans-serif'; ctx.textBaseline = 'middle';
        ctx.fillText('1 000 000 tokens · minns allt · ', 10, h / 2);
      });
      tex.wrapS = THREE.RepeatWrapping;
      this.ribbon = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.55), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
      this.ribbon.rotation.set(-Math.PI / 2, 0, Math.PI / 2); this.ribbon.receiveShadow = true; scene.add(this.ribbon);
    }
    if (this.g.has('glitch')) {
      const extra = this.bean.legs[0].clone(); extra.position.x = 0; extra.position.z = -0.1; this.bean.rig.add(extra); this.extraLeg = extra;
    }
    this.renameI = 0;
    this.stepSide = 0;
  }

  showBubble(text, opts) {
    if (this.bubble) { scene.remove(this.bubble); this.bubble.material.map.dispose(); this.bubble.material.dispose(); }
    this.bubble = makeBubble(text, opts); this.bubble.userData.age = 0; scene.add(this.bubble);
  }

  get headY() { return this.y + 2.35 * this.scale + (this.spec.acc.includes('tophat') ? 0.5 * this.scale : 0.2); }

  update(dt, now) {
    const b = this.bean, g = this.g;
    this.t += dt;
    let moving = false, poseAmt = 0;

    if (this.state === 'in') {
      const mid = (RUN_START + RUN_END) / 2 - 1;
      if (g.has('think') && !this.thought && this.z > mid) { this.state = 'think'; this.t = 0; this.thought = true; this.showBubble('Tänker…', { bg: '#e9e2ff' }); }
      else {
        this.z += this.speed * dt; moving = true;
        if (this.z >= RUN_END) { this.z = RUN_END; this.state = 'pose'; this.t = 0; this.onPose(); }
      }
    } else if (this.state === 'think') {
      if (this.t > 2.4) { this.state = 'in'; this.t = 0; this.showBubble('Aha!'); }
    } else if (this.state === 'pose') {
      poseAmt = Math.min(1, this.t * 3);
      const dur = g.has('marathon') ? 4.2 : 3.4;
      if (Math.random() < dt * 3) cameraFlash(1);
      if (this.t > dur) {
        this.state = 'out'; this.t = 0; this.targetHeading = Math.PI; onWalkerLeaving(this);
        this.heading = ((this.heading % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        if (this.heading > Math.PI * 1.5) this.heading -= Math.PI * 2;
      }
    } else if (this.state === 'out') {
      if (this.t > 0.35) {
        this.z -= Math.min(this.speed, 4.5) * dt; moving = true;
        this.x += (OUT_X - this.x) * Math.min(1, dt * 2);
        if (this.z < RUN_START - 1.5) { this.state = 'gone'; }
      }
    }

    // heading
    if (this.state === 'pose') this.targetHeading = g.has('spin') ? Math.min(1, this.t / 1.2) * Math.PI * 4 : 0;
    if (this.state === 'in' && g.has('moonwalk')) this.targetHeading = Math.PI;
    const dh = this.targetHeading - this.heading;
    this.heading += dh * Math.min(1, dt * (this.state === 'pose' && g.has('spin') ? 30 : 7));

    // walk cycle
    const stepRate = (g.has('tiny') ? 13 : g.has('big') ? 5.5 : 8) * (g.has('fast') ? 1.6 : 1) * (g.has('slow') ? 0.6 : 1);
    if (moving) this.phase += dt * stepRate;
    const sw = moving ? Math.sin(this.phase) : 0;
    const bob = moving ? Math.abs(Math.cos(this.phase)) * 0.09 : 0;
    const moon = g.has('moonwalk') && this.state === 'in';
    b.legs[0].rotation.x = moon ? Math.max(0, sw) * 0.5 : sw * 0.7;
    b.legs[1].rotation.x = moon ? Math.max(0, -sw) * 0.5 : -sw * 0.7;
    b.arms[0].rotation.x = -sw * 0.6; b.arms[1].rotation.x = sw * 0.6;
    b.body.position.y = 1.25 + bob + Math.sin(now * 2.2 + this.index) * 0.02;
    b.body.rotation.z = sw * 0.09; // sassy hips
    b.body.rotation.y = moving ? Math.sin(this.phase) * 0.12 : 0;
    b.arms[0].rotation.z = -0.28; b.arms[1].rotation.z = 0.28;

    if (this.state === 'think') {
      b.arms[1].rotation.x = -2.3; b.arms[1].rotation.z = -0.4;  // hand to chin
      b.body.rotation.z = Math.sin(this.t * 2) * 0.12;
      b.face.rotation.z = 0.15;
    } else b.face.rotation.z *= 0.9;

    if (this.state === 'pose') {
      const w = Math.sin(this.t * 10);
      b.arms[0].rotation.z = -0.28 - poseAmt * 2.5 - w * 0.25 * poseAmt;  // wave
      b.arms[1].rotation.z = 0.28 + poseAmt * 0.9;  // hand on hip
      b.arms[1].rotation.x = -0.4 * poseAmt;
      b.body.rotation.z = Math.sin(this.t * 3) * 0.12 * poseAmt;
      b.legs[0].rotation.z = -0.25 * poseAmt;
      if (g.has('marathon')) { // jumping jacks
        const j = Math.abs(Math.sin(this.t * 7));

      }
    } else { b.rig.position.y *= 0.8; b.legs[0].rotation.z *= 0.8; b.legs[1].rotation.z *= 0.8; }

    // blink
    const blink = (now + this.index * 0.7) % 3.2 < 0.12 ? 0.1 : 1;
    b.eyes.forEach(e => e.scale.y = blink);

    // cape / tail sway
    b.accs.forEach(a => {
      if (a.userData.cape) a.userData.cape.rotation.x = -0.15 - (moving ? 0.25 + Math.sin(this.phase * 2) * 0.08 : 0);
      if (a.userData.tail) a.userData.tail.rotation.x = Math.sin(now * 5) * 0.3;
    });

    // gags while moving
    if (g.has('fast') && moving && Math.random() < dt * 22) puff(new THREE.Vector3(this.x + (Math.random() - 0.5) * 0.4, this.y + 0.15, this.z - 0.4 * Math.sign(Math.cos(this.heading))), 0xfff3d6);
    if (g.has('big') && moving) {
      const s = Math.sin(this.phase) > 0 ? 1 : -1;
      if (s !== this.stepSide) { this.stepSide = s; shake = 0.14 * this.scale; sfx.thud(); }
    }
    if (g.has('coins') && (moving || this.state === 'pose') && Math.random() < dt * 5) coin(new THREE.Vector3(this.x, this.y, this.z));
    if (g.has('glitch')) {
      const gl = Math.random() < 0.06;
      b.rig.position.x = gl ? (Math.random() - 0.5) * 0.3 : 0;
      b.body.scale.set(gl ? 1.2 : 1, gl ? 0.8 : 1, 1);
      this.extraLeg.rotation.x = Math.sin(this.phase * 1.7) * 0.9;
      b.skin.emissive.setHex(gl ? 0x55ffff : 0x000000);
    }
    if (g.has('rename')) {
      this.renameT = (this.renameT || 0) + dt;
      if (this.renameT > 0.55) { this.renameT = 0; const names = ['4.1', '4o', 'o1', 'o3', '4.5', '4.1?', 'o4', '??']; this.renameI = (this.renameI + 1) % names.length; drawLabel(b.labelTex, names[this.renameI], ...b.labelColors); }
    }

    b.root.position.set(this.x, this.y, this.z);
    b.root.rotation.y = this.heading;

    // followers
    this.followers.forEach(f => {
      const fb = f.bean;
      const dir = this.state === 'out' ? -1 : 1;
      const tx = this.x + f.dx, tz = this.z + f.dz * dir;
      fb.root.position.x += (tx - fb.root.position.x) * Math.min(1, dt * 4);
      fb.root.position.z += (tz - fb.root.position.z) * Math.min(1, dt * 4);
      fb.root.position.y = this.y;
      fb.root.rotation.y = this.heading;
      const fsw = moving ? Math.sin(this.phase + f.ph) : 0;
      fb.legs[0].rotation.x = fsw * 0.7; fb.legs[1].rotation.x = -fsw * 0.7;
      fb.arms[0].rotation.x = -fsw * 0.6; fb.arms[1].rotation.x = fsw * 0.6;
      fb.body.position.y = 1.25 + (moving ? Math.abs(Math.cos(this.phase + f.ph)) * 0.09 : 0);
      if (this.state === 'pose') { fb.arms[0].rotation.z = -0.3 - Math.abs(Math.sin(this.t * 8 + f.ph)) * 2.4; fb.rig.position.y = Math.abs(Math.sin(this.t * 6 + f.ph)) * 0.3; }
      else { fb.arms[0].rotation.z = -0.28; fb.rig.position.y = 0; }
      const fbl = (now + f.ph) % 2.8 < 0.12 ? 0.1 : 1; fb.eyes.forEach(e => e.scale.y = fbl);

    // ribbon

      this.ribbon.material.map.repeat.set(len / 3.5, 1);

    }

    // speech bubbles

      }
    }
    if (this.state === 'out' && this.bubble && this.t > 0.6) { scene.remove(this.bubble); this.bubble = null; }

      const s = a < 0.25 ? 1 + Math.sin(a / 0.25 * Math.PI) * 0.25 : 1;

      this.bubble.scale.set(this.bubble.userData.base.x * k, this.bubble.userData.base.y * k, 1);

    }
  }

  onPose() {
    const center = new THREE.Vector3(this.x, 1, this.z);
    cameraFlash(4); sfx.cheer();
    if (this.g.has('confetti')) { burstConfetti(center); sfx.pop(); }
    if (this.g.has('crash')) floatText('Chipbörsen: −17 %', new THREE.Vector3(this.x - 1.6, this.headY + 0.6, this.z), { bg: '#ff4f6d', fg: '#ffffff' });
    if (this.g.has('big')) { shake = 0.35; }
    audience.forEach(a => a.cheer = 2 + Math.random());
  }

  dispose() {
    const rm = (bean) => { scene.remove(bean.root); bean.labelTex.dispose(); };
    rm(this.bean); this.followers.forEach(f => rm(f.bean));
    if (this.bubble) scene.remove(this.bubble);
    if (this.ribbon) { scene.remove(this.ribbon); this.ribbon.geometry.dispose(); }
  }
}

// ---------------------------------------------------------------- show control
let current = 0;
let paused = false;
let tempo = 1;
let shake = 0;
let spawnedFor = new Set();

function onWalkerLeaving(w) {
  if (spawnedFor.has(w)) return; spawnedFor.add(w);
  goTo((w.index + 1) % MODELS.length, false);
}

function goTo(i, hard) {
  if (hard) { walkers.forEach(w => w.dispose()); walkers = []; clearConfetti(); spawnedFor = new Set(); }
  current = i;
  walkers.push(new Walker(MODELS[i], i));
  updateCard();
  save();
}

// ---------------------------------------------------------------- HUD
const $ = (id) => document.getElementById(id);
$('count').textContent = MODELS.length;
const tl = $('timeline');
MODELS.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.style.background = ORG[m.o].css; btn.style.color = ORG[m.o].css;
  btn.title = `${m.n} · ${m.d}`; btn.setAttribute('aria-label', `Hoppa till ${m.n}`);
  btn.addEventListener('click', () => goTo(i, true));
  tl.appendChild(btn);
});
{
  // year labels positioned by first model of each year
  const years = $('years');
  const firsts = {}; MODELS.forEach((m, i) => { const y = (m.d.match(/20\d\d/) || [''])[0]; if (y && !(y in firsts)) firsts[y] = i; });
  Object.keys(firsts).forEach(y => { const s = document.createElement('span'); s.textContent = y; s.style.left = (firsts[y] / MODELS.length * 100) + '%'; years.appendChild(s); });
}
function updateCard() {
  const m = MODELS[current];
  $('idx').textContent = `Modell ${String(current + 1).padStart(2, '0')} av ${MODELS.length}`;
  $('name').textContent = m.n;
  $('meta').textContent = `${m.o === '???' ? 'Okänt labb' : m.o} · ${m.d}`;
  $('joke').textContent = m.j;
  $('orgdot').style.background = ORG[m.o].css; $('orgdot').style.color = ORG[m.o].css;
  const card = $('card'); card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop');
  [...tl.children].forEach((b, i) => { b.classList.toggle('now', i === current); b.classList.toggle('done', i < current); });
}
$('prev').addEventListener('click', () => goTo((current - 1 + MODELS.length) % MODELS.length, true));
$('next').addEventListener('click', () => goTo((current + 1) % MODELS.length, true));
$('play').addEventListener('click', (e) => { paused = !paused; e.currentTarget.textContent = paused ? 'Spela' : 'Paus'; e.currentTarget.setAttribute('aria-pressed', String(paused)); });
$('tempo').addEventListener('click', (e) => { tempo = tempo === 1 ? 2 : tempo === 2 ? 0.5 : 1; e.currentTarget.textContent = `Tempo ${tempo === 0.5 ? '½' : tempo}×`; });
$('sound').addEventListener('click', (e) => { const on = sfx.toggle(); e.currentTarget.textContent = on ? 'Musik av' : 'Musik på'; e.currentTarget.setAttribute('aria-pressed', String(on)); });
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key === ' ' && document.activeElement === document.body) { e.preventDefault(); $('play').click(); }
});

function save() { try { localStorage.setItem('aiCatwalkIndex', String(current)); } catch (e) {} }
function load() { try { const v = parseInt(localStorage.getItem('aiCatwalkIndex'), 10); return Number.isFinite(v) && v >= 0 && v < MODELS.length ? v : 0; } catch (e) { return 0; } }

// ---------------------------------------------------------------- audio (synthesized runway beat)
const sfx = (() => {
  let ctx = null, master = null, on = false, timer = null, step = 0, nextTime = 0;
  const BPM = 118, STEP = 60 / BPM / 4;
  const bass = [45, 0, 45, 0, 0, 45, 0, 48, 45, 0, 45, 0, 52, 0, 50, 48];
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function noise(dur) { const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = ctx.createBufferSource(); s.buffer = b; return s; }

  function kick(t) { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15); env(g, t, 0.002, 0.9, 0.3); o.connect(g).connect(master); o.start(t); o.stop(t + 0.35); }

  function clap(t) { const n = noise(0.3), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'bandpass'; f.frequency.value = 1500; env(g, t, 0.002, 0.35, 0.16); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.3); }
  function bassNote(t, m) { const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), g = ctx.createGain(); o.type = 'sawtooth'; o.frequency.value = mtof(m); f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(200, t + 0.2); env(g, t, 0.005, 0.28, 0.2); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + 0.3); }
  function tick() {
    while (nextTime < ctx.currentTime + 0.12) {
      const s = step % 16;
      if (s % 4 === 0) kick(nextTime);
      if (s === 4 || s === 12) clap(nextTime);
      hat(nextTime, s % 4 === 2);
      if (bass[s]) bassNote(nextTime, bass[s]);
      nextTime += STEP; step++;
    }
  }
  function blipTone(freq, dur, type = 'sine', vol = 0.15) {
    if (!on) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur);
    env(g, t, 0.005, vol, dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    toggle() {
      if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false; ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.35; master.connect(ctx.destination); }
      on = !on;
      if (on) { ctx.resume(); nextTime = ctx.currentTime + 0.05; timer = setInterval(tick, 25); }
      else { clearInterval(timer); }
      return on;
    },
    blip() { blipTone(700 + Math.random() * 300, 0.08, 'triangle', 0.12); },
    pop() { blipTone(300, 0.2, 'square', 0.1); },
    thud() { if (!on) return; const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(30, t + 0.2); env(g, t, 0.003, 0.6, 0.22); o.connect(g).connect(master); o.start(t); o.stop(t + 0.3); },
    shutter() { if (!on) return; const t = ctx.currentTime, n = noise(0.06), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'highpass'; f.frequency.value = 3000; env(g, t, 0.001, 0.12, 0.04); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 0.07); },
    cheer() { if (!on) return; const t = ctx.currentTime, n = noise(1.6), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 0.6; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.2); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5); n.connect(f).connect(g).connect(master); n.start(t); n.stop(t + 1.6); },
  };
})();

// ---------------------------------------------------------------- camera + loop
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const camTarget = new THREE.Vector3(0, 1.6, 0);
const camPos = new THREE.Vector3(6, 4.5, 14);
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.fov = w / h < 0.8 ? 62 : 42;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = paused ? 0 : rawDt * tempo;
  elapsed += dt;

  walkers.forEach(w => w.update(dt, elapsed));
  for (let i = walkers.length - 1; i >= 0; i--) if (walkers[i].state === 'gone') { walkers[i].dispose(); walkers.splice(i, 1); }

  // audience
  audience.forEach(a => {
    a.cheer = Math.max(0, (a.cheer || 0) - dt);
    const hop = a.cheer > 0 ? Math.abs(Math.sin(elapsed * 9 + a.phase)) * 0.3 : Math.abs(Math.sin(elapsed * 2 + a.phase)) * 0.04;
    a.g.position.y = a.base + hop;
    a.flash = Math.max(0, a.flash - dt * 4);
    a.phone.material.emissiveIntensity = a.flash * 4 + 0.15;
  });
  if (!paused && Math.random() < dt * 0.8) cameraFlash(1);
  glows.forEach(gl => { gl.life = Math.max(0, gl.life - dt * 5); gl.s.material.opacity = gl.life; gl.s.scale.setScalar(1 + (1 - gl.life) * 1.5); });
  flashLight.intensity = Math.max(0, flashLight.intensity - dt * 18);

  updateConfetti(dt);
  updateBits(dt);

  // camera follows the star of the moment
  const star = walkers.find(w => w.index === current) || walkers[0];
  const portrait = camera.aspect < 0.8;
  if (star) {
    const posing = star.state === 'pose';
    const sc = star.scale;
    const focusZ = star.z;
    const tgt = new THREE.Vector3(star.x * 0.5, 1.2 + sc * 0.9, focusZ);
    const sway = reduceMotion ? 0 : Math.sin(elapsed * 0.25) * 1.5;
    const dist = (posing ? 7 : 9.5) * (0.55 + sc * 0.45) * (portrait ? 1.35 : 1);
    const pos = new THREE.Vector3(3.2 + sway, 2.6 + sc * 1.1 + (posing ? 0 : 0.8), focusZ + dist);
    pos.z = Math.min(pos.z, RUN_END + 11 * (portrait ? 1.4 : 1));
    camTarget.lerp(tgt, Math.min(1, rawDt * 2.2));
    camPos.lerp(pos, Math.min(1, rawDt * 1.4));
  }
  shake = Math.max(0, shake - rawDt * 1.2);
  camera.position.copy(camPos);
  if (shake > 0 && !reduceMotion) camera.position.add(new THREE.Vector3((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, 0));
  camera.lookAt(camTarget);

  rimL.intensity = 1.1 + Math.sin(elapsed * 1.3) * 0.3;
  rimR.intensity = 1.0 + Math.cos(elapsed * 1.1) * 0.3;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function start(data) {
  const i = data && Number.isInteger(data.current) ? data.current : load();
  goTo(i, true);
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ current }));
const boot = () => (window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}));
// wait briefly for fonts so the chest labels use the display face
const fontsReady = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('400 40px "Bagel Fat One"'), document.fonts.load('800 40px Nunito')]).catch(() => {})
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(() => {
  const { canvas: c, ctx } = wallTex.userData; drawWall(ctx, c.width, c.height); wallTex.needsUpdate = true;
  boot();
});
})();
</script>
</body>
</html>
